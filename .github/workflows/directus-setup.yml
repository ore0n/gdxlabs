name: Directus setup

# Runs tools/directus_setup.py against the Directus instance and commits the
# generated frontend config. Needs the repository variable DIRECTUS_URL and
# the secret DIRECTUS_TOKEN (admin token); NOTIFY_EMAIL is optional.
on:
  workflow_dispatch:
    inputs:
      import_posts:
        description: Bestehende Blogbeiträge als Entwürfe importieren
        type: boolean
        default: false
      without_custom_rules:
        description: Notmodus ohne Directus-Lizenz (Entwürfe per API lesbar, alle Dateien öffentlich)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run setup script
        env:
          DIRECTUS_URL: ${{ vars.DIRECTUS_URL }}
          DIRECTUS_TOKEN: ${{ secrets.DIRECTUS_TOKEN }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          IMPORT_POSTS: ${{ inputs.import_posts }}
          WITHOUT_CUSTOM_RULES: ${{ inputs.without_custom_rules }}
        run: |
          args=(--write-config js/gdx-directus-config.js)
          if [ -n "$NOTIFY_EMAIL" ]; then args+=(--notify-email "$NOTIFY_EMAIL"); fi
          if [ "$IMPORT_POSTS" = "true" ]; then args+=(--import-posts tools/legacy-posts.json); fi
          if [ "$WITHOUT_CUSTOM_RULES" = "true" ]; then args+=(--without-custom-rules); fi
          python3 tools/directus_setup.py "${args[@]}"

      - name: Commit frontend config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/gdx-directus-config.js
          git diff --cached --quiet || { git commit -m "Update Directus frontend config"; git push; }
