# Only the stencil API is built and deployed from here; the site itself is
# GitHub Pages and needs no pipeline. Modelled on ore0n/allblobs' pipeline,
# onto the same k3s cluster as the LiteLLM platform.
#
# CI/CD variables (masked, protected):
#   KUBECONFIG_CONTENT  raw kubeconfig YAML (or run on an in-cluster runner)
#   KUBE_NAMESPACE      e.g. gdxlabs-stencil
#   STENCIL_HOST        public host of the API, e.g. gdx.pwaxx.com
#   ACME_EMAIL          Let's Encrypt contact
#   LITELLM_API_KEY     virtual key scoped to stencil-diffuser (see stencil-api/README.md)
#   LITELLM_URL         optional; defaults to the in-cluster litellm Service in
#                       KUBE_LITELLM_NAMESPACE (default: KUBE_NAMESPACE)

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

stages: [verify, package, deploy]

variables:
  BUILDKIT_IMAGE: "moby/buildkit:v0.31.2"
  KUBECTL_IMAGE: "alpine/k8s:1.32.13"
  NODE_IMAGE: "node:22-alpine"
  KUSTOMIZE_VERSION: "5.4.3"
  IMAGE: "$CI_REGISTRY_IMAGE/stencil-api"

# The site is static (GitHub Pages) and needs no pipeline; only changes to the
# stencil API, its manifests or this file rebuild and redeploy it.
.service_changes: &service_changes
  - stencil-api/**/*
  - .gitlab-ci.yml

.install_kustomize: &install_kustomize |
  curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
    | tar xz -C /usr/local/bin kustomize

test:
  stage: verify
  image: "$NODE_IMAGE"
  script:
    - cd stencil-api && npm test
    - cd .. && node --test "js/stencil/*.test.mjs"

build-image:
  stage: package
  image:
    name: "$BUILDKIT_IMAGE"
    entrypoint: [""]
  needs: [test]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *service_changes
  before_script:
    - mkdir -p "$HOME/.docker"
    - AUTH="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$AUTH" > "$HOME/.docker/config.json"
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context="$CI_PROJECT_DIR/stencil-api" \
        --local dockerfile="$CI_PROJECT_DIR/stencil-api" \
        --output "type=image,name=$IMAGE:$CI_COMMIT_SHA,push=true" \
        --progress plain

deploy-production:
  stage: deploy
  image:
    name: "$KUBECTL_IMAGE"
    entrypoint: [""]
  interruptible: false
  resource_group: production
  needs: [build-image]
  environment:
    name: production
    url: "https://$STENCIL_HOST/api/healthz"
  # Automatic: every push to main that touches the service redeploys it, and
  # so does every tag. Same rules as build-image, so the two always agree.
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *service_changes
  before_script:
    - apk add --no-cache gettext curl bash
    - *install_kustomize
  script:
    - |
      missing=""
      for v in KUBE_NAMESPACE STENCIL_HOST ACME_EMAIL LITELLM_API_KEY; do
        eval "val=\${$v:-}"; [ -z "$val" ] && missing="$missing $v"
      done
      [ -z "$missing" ] || { echo "Missing CI/CD variables:$missing"; exit 1; }
      case "$LITELLM_API_KEY" in sk-*) ;; *) echo "LITELLM_API_KEY must be a LiteLLM virtual key (sk-...)"; exit 1 ;; esac
    - |
      if [ -n "${KUBECONFIG_CONTENT:-}" ]; then
        umask 077; mkdir -p .kube; export KUBECONFIG="$CI_PROJECT_DIR/.kube/config"
        printf '%s\n' "$KUBECONFIG_CONTENT" > "$KUBECONFIG"
      fi
    - |
      if [ -z "${LITELLM_URL:-}" ]; then
        export LITELLM_URL="http://litellm.${KUBE_LITELLM_NAMESPACE:-$KUBE_NAMESPACE}.svc.cluster.local:4000"
      fi
      echo "LiteLLM: $LITELLM_URL"
    - kubectl create namespace "$KUBE_NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
    - |
      printf '%s' "$LITELLM_API_KEY" > /tmp/vkey
      kubectl create secret generic stencil-litellm --namespace "$KUBE_NAMESPACE" \
        --from-file=api-key=/tmp/vkey --dry-run=client -o yaml | kubectl apply -n "$KUBE_NAMESPACE" -f -
      rm -f /tmp/vkey
      kubectl create secret docker-registry regcred --namespace "$KUBE_NAMESPACE" \
        --docker-server="$CI_REGISTRY" \
        --docker-username="${REGISTRY_PULL_USER:-$CI_REGISTRY_USER}" \
        --docker-password="${REGISTRY_PULL_TOKEN:-$CI_REGISTRY_PASSWORD}" \
        --dry-run=client -o yaml | kubectl apply -n "$KUBE_NAMESPACE" -f -
    - |
      cd stencil-api/k8s
      kustomize edit set image "stencil-api=$IMAGE:$CI_COMMIT_SHA"
      kustomize build . | envsubst '${KUBE_NAMESPACE} ${LITELLM_URL} ${ACME_EMAIL} ${STENCIL_HOST}' > "$CI_PROJECT_DIR/rendered.yaml"
      cd "$CI_PROJECT_DIR"
    - kubectl apply -n "$KUBE_NAMESPACE" -f rendered.yaml
    - kubectl rollout status -n "$KUBE_NAMESPACE" deployment/stencil-api --timeout=5m
    - |
      POD="$(kubectl get pod -n "$KUBE_NAMESPACE" -l app=stencil-api -o jsonpath='{.items[0].metadata.name}')"
      kubectl exec -n "$KUBE_NAMESPACE" "$POD" -- wget -qO- --timeout=10 http://127.0.0.1:8080/api/readyz; echo
      kubectl logs -n "$KUBE_NAMESPACE" "$POD" --tail=5
    - echo "Deployed. https://$STENCIL_HOST/api/healthz"
  artifacts:
    when: always
    expire_in: 1 week
    paths: [rendered.yaml]
