<main>
  <div class="page-head"><h1>Contact Us</h1></div>
  <section class="section">
    <div class="contact-grid">
      <div class="panel">
        <form class="form" method="post" action="#" novalidate>
          <input type="hidden" name="_wpcf7" value="212">
          <label>Your Name (required)<input type="text" name="your-name" autocomplete="name" required></label>
          <label>Your Email (required)<input type="email" name="your-email" autocomplete="email" required></label>
          <label>Subject<input type="text" name="your-subject"></label>
          <label>Your Message<textarea name="your-message" rows="7" required></textarea></label>
          <button class="btn" type="submit">Send</button>
          <div class="wpcf7-response-output" role="status"></div>
        </form>
      </div>
      <div class="panel map-panel">
        <h2>Hier finden Sie uns</h2>
        <address>Ragnitzstraße 327e, 8047 Kainbach bei Graz</address>
        <iframe class="map" title="Karte: Ragnitzstraße 327e, 8047 Kainbach bei Graz" loading="lazy"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d861.5090946903578!2d15.5155761292717!3d47.075476698697074!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x476e4bb0b16ea811%3A0xf2197ca87bcf1508!2sRagnitzstra%C3%9Fe+327e%2C+8047+Kainbach+bei+Graz!5e1!3m2!1sde!2sat!4v1520260277078"></iframe>
      </div>
    </div>
  </section>
</main>

    <form class="form newsletter" method="post" action="#" novalidate>
      <input type="hidden" name="_wpcf7" value="482">
      <h2>Subscribe Email</h2>
      <p class="lead" lang="de">Abonnieren Sie unseren Newsletter für Updates und aktuelle Informationen.</p>
      <div class="fields">
        <label>Your Name (required)<input type="text" name="your-name" autocomplete="name" required></label>
        <label>Your Email (required)<input type="email" name="your-email" autocomplete="email" required></label>
        <button class="btn" type="submit">Send</button>
      </div>
      <div class="wpcf7-response-output" role="status"></div>
    </form>
