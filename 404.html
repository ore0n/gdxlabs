<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – GdxLabs</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/wp-content/uploads/2016/09/Logo-gdx3.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Source+Code+Pro:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/css/site.css">
<script>
  // Breakdown reports posts as /posts/<slug>/; the news page is /news/?post=<slug>.
  // GitHub Pages serves this page for every unknown path, so the redirect happens here.
  (function () {
    var m = location.pathname.match(/^\/posts\/([^\/]+)\/?$/);
    if (m) location.replace('/news/?post=' + encodeURIComponent(m[1]));
  })();
</script>
</head>
<body>
<canvas id="smoke" aria-hidden="true"></canvas>

<!-- served by GitHub Pages for every unknown path, so all links are absolute -->
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="/"><img src="/wp-content/uploads/2018/03/gdxlabs_white.png" alt="GdxLabs"></a>
    <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" aria-label="Hauptmenü">
      <ul>
        <li><a href="/contact-us/">Contact Us</a></li>
        <li><a href="/#whatwedo">What We Do</a></li>
        <li><a href="/#whoweare">Who We Are</a></li>
        <li><a href="/news/">News</a></li>
        <li><a href="/#career">Career</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <div class="page-head"><h1>404</h1></div>
  <section class="section not-found">
    <p>Page not found.</p>
    <a class="scroll-cue" href="/">GdxLabs Home</a>
  </section>
</main>

<script src="/js/smoke.js"></script>
<script src="/js/nav.js"></script>
</body>
</html>
