apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: stencil-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: "${ACME_EMAIL}"
    privateKeySecretRef:
      name: stencil-issuer-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
