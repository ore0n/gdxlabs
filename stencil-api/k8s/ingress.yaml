apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stencil-api
  annotations:
    cert-manager.io/issuer: stencil-issuer
    # Every request here is short: a draw is a job the page polls for, never
    # a held-open connection.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "8k"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - "${STENCIL_HOST}"
      secretName: stencil-tls
  rules:
    - host: "${STENCIL_HOST}"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stencil-api
                port:
                  name: http
